<aside class="sidebar" [class.is-collapsed]="isCollapsed" aria-label="Navegación principal">
  <!-- Brand block -->
  <header class="brand">
    <span class="brand__mark" aria-hidden="true">IN</span>
    <span *ngIf="!isCollapsed" class="brand__text">
      <span class="brand__name">INARCO</span>
      <span class="brand__sub">SSTMA · 2026</span>
    </span>
  </header>

  <!-- Eyebrow -->
  <p *ngIf="!isCollapsed" class="nav-eyebrow">MÓDULOS DE SSTMA</p>

  <nav class="nav" aria-label="Módulos">
    <!-- Direct item: Plan Personalizado -->
    <a
      class="nav-item"
      [routerLink]="directItem.link"
      routerLinkActive="is-active"
      [attr.aria-label]="directItem.label"
    >
      <span class="ms-r nav-item__icon" aria-hidden="true">{{ directItem.icon }}</span>
      <span *ngIf="!isCollapsed" class="nav-item__label">{{ directItem.label }}</span>
    </a>

    <!-- Grupos colapsables -->
    <div class="nav-group" *ngFor="let g of groups">
      <button
        type="button"
        class="nav-group__header"
        (click)="toggleGroup(g)"
        [attr.aria-expanded]="g.expanded"
      >
        <span class="ms-r nav-group__icon" aria-hidden="true">{{ g.icon }}</span>
        <span *ngIf="!isCollapsed" class="nav-group__label">{{ g.label }}</span>
        <span *ngIf="!isCollapsed" class="ms-r nav-group__chevron" [class.is-open]="g.expanded" aria-hidden="true">
          expand_more
        </span>
      </button>

      <ul *ngIf="g.expanded && !isCollapsed" class="nav-group__items" role="list">
        <li *ngFor="let it of g.items">
          <a
            class="nav-subitem"
            [routerLink]="it.link"
            routerLinkActive="is-active"
            [attr.aria-label]="it.label"
          >
            <span class="ms-r nav-subitem__icon" aria-hidden="true">{{ it.icon }}</span>
            <span class="nav-subitem__label">{{ it.label }}</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Status footer -->
  <footer *ngIf="!isCollapsed" class="sidebar-status">
    <span class="status-dot" aria-hidden="true"></span>
    <span class="status-label">Sincronizado</span>
  </footer>
</aside>
