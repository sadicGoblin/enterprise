<section class="page" aria-labelledby="add-reports-title">
  <header class="page-header">
    <div class="page-header__text">
      <span class="eyebrow">REPORTES</span>
      <h1 id="add-reports-title" class="page-header__title">Reporte de actividades</h1>
      <p class="page-header__description">Carga y gestión de reportes de actividades SSTMA por obra.</p>
    </div>
  </header>
<div class="map-container">
  <mat-card class="map-card">
    <div *ngIf="isLoading" class="spinner-overlay">
      <mat-spinner></mat-spinner>
    </div>

    <div class="map-card-header">
      <h2 class="title">Ingreso Reporte</h2>
      <button
        mat-flat-button
        color="primary"
        class="add-user-button"
        *ngIf="!isFormVisible"
        [matMenuTriggerFor]="createReportMenu"
      >
        <mat-icon>add_circle</mat-icon> Crear Reporte
      </button>

      <mat-menu #createReportMenu="matMenu">
        <button mat-menu-item (click)="createReport('0')">ART</button>
        <button mat-menu-item (click)="createReport('1')">Inspección</button>
        <button mat-menu-item (click)="createReport('2')">Reporte de Incidentes</button>
      </mat-menu>
    </div>

    <app-reports-table></app-reports-table>
  </mat-card>
</div>
</section>
