<section class="page" aria-labelledby="passwd-title">
  <header class="page-header">
    <div class="page-header__text">
      <span class="eyebrow">ADMINISTRACIÓN</span>
      <h1 id="passwd-title" class="page-header__title">Cambio de clave</h1>
      <p class="page-header__description">Actualiza la contraseña de los usuarios del sistema.</p>
    </div>
  </header>
<div class="container">
  <mat-card class="mat-container">

    <div class="form-column">
      <mat-form-field appearance="fill">
        <mat-label>Usuario</mat-label>
        <input matInput [(ngModel)]="username" disabled />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Clave Antigua</mat-label>
        <input matInput type="password" [(ngModel)]="oldPassword" />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Nueva Clave</mat-label>
        <input matInput type="password" [(ngModel)]="newPassword" />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Repetir Nueva Clave</mat-label>
        <input matInput type="password" [(ngModel)]="repeatPassword" />
      </mat-form-field>
    </div>

    <div class="button-row">
      <app-btn variant="accent" size="md" icon="save" [loading]="loading" [disabled]="loading" (click)="changePassword()">
        {{ loading ? 'Procesando…' : 'Grabar' }}
      </app-btn>
    </div>
  </mat-card>
</div>
</section>
